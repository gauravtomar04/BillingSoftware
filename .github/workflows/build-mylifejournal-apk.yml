name: Build My Life Journal APK
on:
  push:
    branches: [mylifejournal-apk-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-apk:
    name: Build and verify Material 3 Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/build-tools/35.0.0" >> "$GITHUB_PATH"
      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build native app
        run: gradle --no-daemon --stacktrace --console=plain :app:assembleDebug
      - name: Verify APK
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          aapt dump badging "$APK" | grep -E "^package:|^application-label:"
          apksigner verify --verbose "$APK"
          unzip -p "$APK" assets/ui.json | grep -q 'jetpack-compose-material3'
          echo "Material 3 APK archive, package, signature and embedded JSON configuration verified."
      - uses: actions/upload-artifact@v4
        with:
          name: MyLifeJournal-Material3-v3-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
